<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Добро пожаловать</h2>
            <p>Войдите или создайте аккаунт</p>
        </div>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <!-- Переключатель Вход/Регистрация -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showForm('login')">Вход</button>
            <button class="tab-btn" onclick="showForm('register')">Регистрация</button>
        </div>

        <form method="POST" action="{{ url_for('login') }}" id="authForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required placeholder="Минимум 6 символов">
            </div>
            
            <!-- Поле выбора роли (видно только при регистрации) -->
            <div class="form-group" id="role_select" style="display:none;">
                <label>Я регистрируюсь как:</label>
                <select name="user_type">
                    <option value="student">Студент / Соискатель</option>
                    <option value="organization">Компания-резидент</option>
                    <option value="university">Представитель ВУЗа</option>
                </select>
            </div>

            <!-- Скрытое поле для определения действия -->
            <input type="hidden" name="action" id="formAction" value="login">

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Войти</button>
        </form>
    </div>

    <script>
        function showForm(type) {
            const roleSelect = document.getElementById('role_select');
            const actionInput = document.getElementById('formAction');
            const submitBtn = document.getElementById('submitBtn');
            const tabs = document.querySelectorAll('.tab-btn');

            if (type === 'register') {
                roleSelect.style.display = 'block';
                actionInput.value = 'register';
                submitBtn.innerText = 'Зарегистрироваться';
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            } else {
                roleSelect.style.display = 'none';
                actionInput.value = 'login';
                submitBtn.innerText = 'Войти';
                tabs[1].classList.remove('active');
                tabs[0].classList.add('active');
            }
        }
    </script>
</body>
</html>
