<!-- templates/layout.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Кабинет кандидата{% endblock %}</title>
    <!-- Общие стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Базовые стили для макета */
        body, html { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .dashboard-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; flex-shrink: 0; background-color: #fff; border-right: 1px solid #eee; display: flex; flex-direction: column; }
        .sidebar .logo { padding: 20px; font-weight: bold; font-size: 1.2rem; }
        .sidebar .menu { list-style: none; padding: 0; margin: 0; }
        .sidebar .menu a { display: block; padding: 12px 20px; text-decoration: none; color: #333; border-left: 3px solid transparent; }
        .sidebar .menu a:hover { background-color: #f8f9fa; }
        .sidebar .menu a.active { border-left-color: var(--primary-color, #0d6efd); background-color: #f0f2f5; font-weight: 500; }
        .sidebar .bottom-menu { margin-top: auto; padding: 20px; }
        .main-content { flex-grow: 1; background-color: #f8f9fa; }
        .top-bar { background-color: #fff; padding: 20px; border-bottom: 1px solid #eee; }
        .content { padding: 20px; }
    </style>

    <!-- Блок для дополнительных стилей со дочерних страниц -->
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo">👤 Кандидат</div>
            <ul class="menu">
                <li><a href="{{ url_for('students.search_jobs') }}" class="{% if 'search_jobs' in request.endpoint %}active{% endif %}">Поиск работы</a></li>
                <li><a href="{{ url_for('students.resume') }}" class="{% if 'resume' in request.endpoint %}active{% endif %}">Мое резюме</a></li>
                <li><a href="#" style="color: #6c757d;">Отклики</a></li>
            </ul>
            <div class="bottom-menu">
                <a href="{{ url_for('logout') }}" style="color: #6c757d;">Выйти ({{ user.email }})</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h2 class="h4 mb-0">{% block header_title %}{% endblock %}</h2>
            </header>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Блок для скриптов со дочерних страниц -->
    {% block scripts %}{% endblock %}
</body>
</html>
